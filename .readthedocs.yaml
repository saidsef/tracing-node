version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    # The docs toolchain is Python and Read the Docs reads no npm metadata, so the
    # pins are taken out of package.json here to keep one source of truth.
    post_install:
      - pip install $(python -c "import json;print(' '.join(json.load(open('package.json'))['docs']['pip']))")

mkdocs:
  configuration: mkdocs.yml
